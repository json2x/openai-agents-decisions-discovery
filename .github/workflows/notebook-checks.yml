name: Notebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check notebooks without executing API requests
        run: python scripts/check_notebooks.py
